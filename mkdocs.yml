site_name: DraARL Server Docs
site_description: DraARL Server 完整文档 - 数字无线电高级应用实时链路平台
site_url: "https://daofengql.github.io/DraARL-Server/"
repo_name: Daofengql/DraARL-Server
repo_url: https://github.com/Daofengql/DraARL-Server
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

exclude_docs: |
  audit-2026-10-03.md
  remediation-plan-2026-10-03.md
  backend-review-2026-10-03.md
  client-sync-and-rfbox-2026-11-09.md
  optimization-validation-2026-11-07.md
  single-node-access-cleanup-2026-11-08.md
  site-settings-validation-2026-11-12.md
  todo-validation-2026-11-07.md
  todo-validation-evidence-2026-11-07.json
  security/**

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 开始使用:
      - 总览: usage/README.md
      - 部署与配置: usage/01-部署与配置.md
      - 账号、登录与权限: usage/02-账号登录与权限.md
      - 用户控制台: usage/03-用户控制台.md
      - 设备与群组: usage/04-设备与群组.md
      - 在线收发与通信记录: usage/05-在线收发与通信记录.md
  - 管理与运维:
      - 管理员后台: usage/06-管理员后台.md
      - 运维与排障: usage/08-运维与排障.md
      - 固件与 OTA 升级: usage/09-固件与OTA升级.md
      - APRS 与位置服务: usage/10-APRS与位置服务.md
      - 会话安全与代理升级: usage/13-会话安全与代理升级说明.md
      - 多中心群组互联: 多中心群组互联设计.md
      - 数据字典: 数据字典.md
  - 设备与客户端开发:
      - 设备接入与 API 快速对接: usage/07-设备接入与API快速对接.md
      - DraARLv1 协议: Protocol.md
      - WebSocket 协议: api/10-WebSocket协议详解.md
      - 客户端资源分发: api/12-客户端资源分发.md
  - API 文档:
      - 总览: api/README.md
      - 约定与鉴权: api/00-约定与鉴权.md
      - 认证与 SSO: api/01-认证与SSO.md
      - 用户与资料: api/02-用户与资料.md
      - 设备与配置: api/03-设备与配置.md
      - 群组与互联: api/04-群组与互联.md
      - 无线电与实时通信: api/05-无线电与实时通信.md
      - 通联记录与日志: api/06-通联记录与日志.md
      - 资源上传与站点配置: api/07-资源上传与站点配置.md
      - 运维与管理接口: api/08-运维与管理接口.md
      - 完整路由索引: api/09-完整路由索引.md
      - 错误码与状态码: api/11-错误码与状态码.md
      - 群组自动播报: api/13-群组自动播报.md
  - 架构与性能:
      - 架构设计: 架构设计.md
      - UDP 转发压力测试: UDP单机转发压力测试.md
      - 幽灵多收与消息查询性能验证: 幽灵多收与消息查询性能验证.md
      - 前端组件规范: frontend-components.md
      - 数据库迁移: database-migrations.md
  - 版本记录:
      - v2.0.1-alpha11: release-v2.0.1-alpha11.md
      - v2.0.1-alpha10: release-v2.0.1-alpha10.md
      - v2.0.1-alpha9: release-v2.0.1-alpha9.md
      - v2.0.1-alpha8: release-v2.0.1-alpha8.md
      - v2.0.1-alpha7: release-v2.0.1-alpha7.md
      - v2.0.0-alpha3 幽灵多端与频道消息: usage/12-幽灵多端与频道消息升级说明.md
